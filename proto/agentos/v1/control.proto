syntax = "proto3";

package agentos.v1;

option go_package = "github.com/jchen0426/agentos/gen/go/agentos/v1;agentosv1";

// Served on the control socket (0700 directory, invisible to the sandbox).
// Only agentctl talks to it; the Worker never can.
service Control {
  rpc StartRun(StartRunRequest) returns (Run);                       // starts the Temporal workflow
  rpc GetRun(GetRunRequest) returns (Run);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc CancelRun(CancelRunRequest) returns (Run);
  rpc ListPending(ListPendingRequest) returns (ListPendingResponse);  // approvals and reconciliations (M3, M4)
  rpc GetApproval(GetApprovalRequest) returns (Approval);             // M4: the approval card, decided or not
  rpc ResolveApproval(ResolveApprovalRequest) returns (ResolveApprovalResponse);                  // M4
  rpc ResolveReconciliation(ResolveReconciliationRequest) returns (ResolveReconciliationResponse); // M3
  rpc ExtendBudget(ExtendBudgetRequest) returns (Run);                                            // M2a, backs `agentctl budget extend`
  rpc ExplainRun(ExplainRunRequest) returns (Explanation);           // M5, backs `agentctl runs explain`
  rpc VerifyAudit(VerifyAuditRequest) returns (AuditReport);         // M5, backs `agentctl audit verify`
  rpc ExportAudit(ExportAuditRequest) returns (stream AuditExportPart); // M5, backs `agentctl audit export`
}

message StartRunRequest {
  string task = 1;                  // a registered task, e.g. "security-audit"
  map<string, string> params = 2;   // validated and resolved by agentd, e.g. repo, commit, base
  int64 budget_limit_micros = 3;    // 0 means the task's default
  bool dry_run = 4;                 // write tools render and record their payloads, and send nothing
}

message GetRunRequest {
  string run_id = 1;
}

message ListRunsRequest {
  int32 limit = 1;                  // 0 means 20
}

message ListRunsResponse {
  repeated Run runs = 1;            // newest first
}

message CancelRunRequest {
  string run_id = 1;
}

message Run {
  string run_id = 1;                // the Temporal workflow ID, generated by agentd
  string temporal_run_id = 2;       // the execution agentd started; the gateway only serves this one
  string task = 3;
  // CREATED, RUNNING, WAITING_APPROVAL, WAITING_RECONCILE, PAUSED_BUDGET,
  // SUCCEEDED, FAILED, CANCELLED; UNKNOWN once Temporal no longer has the execution
  string state = 4;
  map<string, string> params = 5;   // as resolved by agentd (commit is the full 40-char SHA)
  int64 budget_limit_micros = 6;    // the current limit: the start's plus every extension
  string created_at = 7;            // RFC 3339, UTC
  string result_json = 8;           // the workflow result once SUCCEEDED
  string failure = 9;               // the failure message once FAILED
  int64 budget_spent_micros = 10;   // settled model requests
  int64 budget_reserved_micros = 11; // reserved by requests not yet settled
  bool dry_run = 12;                // started with dry_run: nothing it writes is sent
}

message ListPendingRequest {}

message ListPendingResponse {
  repeated PendingItem items = 1;
}

message PendingItem {
  string kind = 1;                  // "approval" or "reconciliation"
  string id = 2;                    // approval_id or effect_id
  string run_id = 3;
  string expires_at = 4;            // RFC 3339; approvals only
  string tool = 5;                  // the tool whose effect it is
  string reason = 6;                // why it waits: for a reconciliation, what is unknown
  string since = 7;                 // RFC 3339: when it started waiting
  string payload_json = 8;          // reconciliations: exactly what the external system was to receive
  string payload_sha256 = 9;        // approvals: of the payload GetApproval shows, which a decision names
}

message GetApprovalRequest {
  string approval_id = 1;
}

// An approval card (design doc, section 10): what agentd itself observed, never what the agent
// says about the write. Text in it comes from models, tools and the outside world: it leaves
// agentd without raw control characters.
message Approval {
  string approval_id = 1;
  string run_id = 2;
  string tool = 3;                  // the write, e.g. github.open_draft_pr
  // PENDING, APPROVED, REJECTED, EXPIRED, EDITED (the edit went back to the workflow),
  // SUPERSEDED (the approval of the edited call replaced it)
  string status = 4;
  string created_at = 5;            // RFC 3339
  string expires_at = 6;            // RFC 3339: void from then on; agentd expires it as a rejection
  string payload_sha256 = 7;        // of payload_json: a decision names it
  string payload_json = 8;          // exactly what the external system will receive, as recorded
  string context_json = 9;          // what agentd observed when it made the approval: the write and the task's context
  string decided_by = 10;
  string decided_at = 11;
  string reason = 12;               // a rejection's reason, or why it expired
  string supersedes = 13;           // the approval whose edit this one carries
  string superseded_by = 14;
  string edited_patch = 15;         // EDITED, SUPERSEDED: the reviewer's patch
  int64 budget_spent_micros = 16;   // the run's spending, now
  int64 budget_reserved_micros = 17;
  int64 budget_limit_micros = 18;
}

message ResolveApprovalRequest {
  string approval_id = 1;
  string payload_sha256 = 2;        // hash of what the reviewer saw; must match the stored payload
  string idempotency_key = 3;       // required: the same decision sent again applies once
  oneof decision {
    Approve approve = 4;
    ApproveWithEdits approve_with_edits = 5;  // returned to the workflow as "edited"
    Reject reject = 6;                        // reason is required
  }
  string decided_by = 7;            // required: the reviewer, as recorded and reported
}

message Approve {}

message ApproveWithEdits {
  string edited_patch = 1;
}

message Reject {
  string reason = 1;
}

// The first valid decision wins: one that comes after another fails with FAILED_PRECONDITION,
// naming the decision, who made it and when.
message ResolveApprovalResponse {
  string status = 1;                // APPROVED, REJECTED or EDITED; sent again, what became of it since
  string decided_by = 2;
  string decided_at = 3;
}

message ResolveReconciliationRequest {
  string effect_id = 1;
  bool executed = 2;                // the person's finding: did the external write happen?
  string result_json = 3;           // when executed: what it produced, e.g. the PR's URL
  string idempotency_key = 4;       // required: the same finding sent again applies once
  bool lookup = 5;                  // when executed: agentd looks the result up itself (lookup tools)
}

message ResolveReconciliationResponse {
  // The effect's status now: SUCCEEDED (executed), PENDING (not executed: the run's next call
  // sends it again under its original key) or ABANDONED (not executed, and the run was cancelled).
  string status = 1;
}

message ExtendBudgetRequest {
  string run_id = 1;
  int64 amount_micros = 2;          // added to the run's limit; must be positive
  string idempotency_key = 3;       // required: a retried request with the same key adds nothing
}

message ExplainRunRequest {
  string run_id = 1;
}

// Why a run is where it is (design doc, section 5): Temporal's history and agentd's ledger, the
// audit log among it, read together. The verdict, the step and the kind come from what agentd
// recorded itself and from what Temporal recorded (event types, timeouts, attempts); a result in the
// history counts only when its _audit names agentd's record of it. What the Worker wrote (its
// result's outcome, its failure messages) is only its claim. Text from the Worker, a tool, a model or
// the outside world leaves agentd bounded, quoted where agentd's words carry it, and without raw
// control characters or runs of spaces.
message Explanation {
  string run_id = 1;
  string step = 2;                  // the step that went wrong, as the task names it (D12), else the call's kind and name, quoted
  string cause = 3;
  repeated string evidence = 4;     // history events and ledger rows behind the conclusion, as lines (sources has them apart)
  // CREATED, RUNNING, WAITING_APPROVAL, WAITING_RECONCILE, PAUSED_BUDGET, SUCCEEDED, FAILED, CANCELLED,
  // UNKNOWN: as GetRun says.
  string state = 5;
  // ok (ended well, every step its task requires done; trouble along the way is in incidents),
  // step_failed (ended, but a step's result changed its course, or a step its task requires has no
  // accepted result), not_approved (ended without a write a person did not approve), failed,
  // cancelled, terminated, waiting (for a person: next says how), stuck, running, unknown.
  string verdict = 6;
  // The cause's category: model_refused, model_invalid_output, model_error, tool_error, tool_denied,
  // tool_server_failed, policy_denied, denied, loop_guard, budget_exhausted, approval_pending,
  // approval_rejected, approval_expired, approval_edited, reconcile_pending, report_not_posted,
  // step_missing, foreign_result (a result or a failure in Temporal's history that agentd did not
  // send), dry_ran (a write only dry-run, in a run that is not a dry run), workflow_error,
  // workflow_task_failed, worker_stopped, no_worker, agentd_stopped, activity_timeout, cancelled,
  // terminated, history_unavailable (the history is gone, or longer than agentd reads),
  // record_unreadable (agentd could not read its own record of how a call ended). Empty when nothing
  // went wrong.
  string kind = 7;
  string activity_id = 8;           // the step's gateway call, as the workflow named it
  string call = 9;                  // the call's name, e.g. audit_v1
  int32 attempt = 10;               // the attempt the cause is of
  string next = 11;                 // what to do next: for a wait, the agentctl command it waits for
  repeated Incident incidents = 12; // trouble along the way, apart from the verdict, oldest first
  repeated Evidence sources = 13;   // the evidence behind the verdict, each with where it is
  Cost cost = 14;
  repeated ModelUsage usage = 15;   // by model: what the run's model requests were billed
  string claim = 16;                // the workflow's own words (its outcome, or its failure), as it wrote them: unchecked
  // Sources that were not there, or not read: the run predates the audit log, Temporal no longer has
  // it, the run's records past agentd's bound on what it reads.
  repeated string missing = 17;
  int32 incidents_omitted = 18;     // incidents beyond those listed
}

// Trouble a run met along the way: a retried attempt, a crash inferred from what it left, a wait for
// budget or a reconciliation.
message Incident {
  string at = 1;                    // RFC 3339
  string step = 2;
  string activity_id = 3;
  int32 attempt = 4;
  string kind = 5;                  // as Explanation.kind
  string cause = 6;
  repeated Evidence evidence = 7;
}

// Where a piece of evidence is: an event of the run's history in Temporal, a record of the audit
// log, or a row of another of agentd's tables.
message Evidence {
  string source = 1;                // temporal, audit or ledger
  int64 event_id = 2;               // temporal: the event's ID
  int64 seq = 3;                    // audit: the record's seq
  string table = 4;                 // ledger: the table, e.g. model_calls
  string key = 5;                   // ledger: the row's key
  string what = 6;                  // what it shows
}

message Cost {
  int64 spent_micros = 1;
  int64 reserved_micros = 2;        // held by requests not settled yet
  int64 limit_micros = 3;
}

// What the run's model requests to one model were billed, as the ledger records each request.
message ModelUsage {
  string model = 1;                 // provider/model, as billed
  int64 requests = 2;               // network requests billed to it (a call may make several)
  int64 input_tokens = 3;           // input that was neither written to nor read from the cache
  int64 output_tokens = 4;
  int64 cache_read_tokens = 5;
  int64 cache_write_tokens = 6;
  int64 refusals = 7;               // requests to it the model declined to answer
}

message VerifyAuditRequest {
  string run_id = 1;                // check this run only; empty: every run. The chain is walked whole
  // The keys of other chains whose anchor workflows the namespace may hold, another agentd's: their
  // heads name another agentd. Any other chain's is a mismatch: a chain rewritten from its first
  // record has a new key, and the old one's anchor workflows are what shows it.
  repeated string allow_chains = 2;
  // The keys of chains whose heads this agentd pushed, of a ledger the operator replaced (reset)
  // themselves: only they know that one was not rewritten. Never one that pushed after this chain's
  // first push: two ledgers of one agentd live at once.
  repeated string allow_replaced_ledgers = 3;
}

// The audit log as agentd found it (design doc, section 8): its hash chain, walked from the first
// record, and the anchors of it that Temporal's history holds, the _audit of each result Invoke
// returned. A chain rewritten consistently from some record on is whole again; its anchors are not.
// The runs checked are those Temporal lists, those the audit log records and those in the ledger.
message AuditReport {
  int64 records = 1;                // records that verified, from seq 1
  int64 head_seq = 2;               // the last of them: the chain's head when it is whole
  string head_sha256 = 3;
  int64 broken_at_seq = 4;          // the first seq at which the chain breaks; 0 when it is whole
  string broken_reason = 5;
  int64 anchors_checked = 6;        // results in the runs' histories whose _audit was checked
  repeated AnchorMismatch anchors_mismatched = 7;
  repeated UnavailableRun runs_unavailable = 8;  // runs whose history Temporal could not give: not checked
  int64 runs_checked = 9;           // executions whose history was read and its anchors checked
  // Runs that Temporal or the audit log has, which the ledger's runs table has otherwise or not at
  // all: the ledger alone does not say which runs there are, as whoever rewrites it can drop one.
  repeated RunMismatch runs_mismatched = 10;
  // Where the ledger's tables are not the state the records imply, or the records break the effect
  // protocol (an effect a person was asked to approve, claimed before the approval was used).
  repeated StateMismatch state_mismatched = 11;
  int64 external_anchors_checked = 12;      // the chain's heads agentd pushed to Temporal (the anchor workflows)
  int64 last_external_anchor_seq = 13;      // the latest of them that matches
  int64 records_after_external_anchor = 14; // records no anchor outside the ledger follows yet
  int64 retention_seconds = 15;             // how long the namespace keeps a closed run's history
  // Anchor workflows of the other chains the request allows: not this chain's, and not checked.
  int64 other_anchor_workflows = 16;
  // Runs made before the audit log began: of which the log has no record, with no history left, or
  // with results in Temporal's history that name no record. Not checked; agentctl counts them
  // unchecked unless --allow-before-log.
  repeated UnavailableRun runs_before_log = 17;
  string chain = 18; // the chain's key in its anchor workflows' IDs: its first record's sha256, 16 hex characters
  // The keys of the other chains whose anchor workflows the namespace holds, allowed or not.
  repeated string other_chains = 19;
  // Attempts that recorded their call.started and were cut short: agentd stopped (a crash) before
  // their call record, and the next agentd's start closed them. Not a mismatch.
  repeated CutShortAttempt attempts_cut_short = 20;
  // The ledger's tables verify does not compare with the records, and why.
  repeated UncheckedTable unchecked_tables = 21;
  // What verify did not read of what Temporal holds, past its bounds (anyone with Temporal's API can
  // add anchor workflows, and signals to them): it could not verify all of it, and agentctl never
  // exits 0 on such a report.
  repeated Unread unread = 22;
  // Attempts whose call.started a fault left open: the attempt's call record could not be written
  // (agentd logged it), or the attempt panicked and its record failed too. Not a mismatch, but not
  // checked either: agentctl exits 2 on them.
  repeated UnrecordedAttempt attempts_unrecorded = 23;
  // Executions Temporal says were terminated that agentd did not terminate: it records
  // run.terminating before it asks, and these have none. Someone with Temporal's API, or Temporal
  // itself, ended them. That changes nothing in the ledger: not a mismatch, and agentctl's exit
  // status does not count them.
  repeated TerminatedExecution terminated_outside_agentd = 24;
}

message TerminatedExecution {
  string run_id = 1;
  string temporal_run_id = 2;
  string at = 3; // when, by its history in Temporal; "" when the history does not say
  // Who the caller that terminated it said it was, and why: its own word, which any caller of
  // Temporal's API writes as it likes.
  string claimed_identity = 4;
  string claimed_reason = 5;
}

message UnrecordedAttempt {
  string run_id = 1;
  string activity_id = 2;
  int64 attempt = 3;
  int64 seq = 4; // its call.started
  string why = 5;
}

message Unread {
  string what = 1; // "anchor workflows", or the events of one
  int64 count = 2; // how many were not read; at least that many when listing stopped
  string why = 3;
}

message UncheckedTable {
  string name = 1;
  string why = 2;
}

message CutShortAttempt {
  string run_id = 1;
  string activity_id = 2;
  int64 attempt = 3;
  int64 seq = 4;                    // its call.started
  int64 restarted_seq = 5;          // the agentd.started after it
}

message StateMismatch {
  string kind = 1;                  // effect, approval, run, budget, blob, protocol
  string id = 2;
  string why = 3;
}

// A result in a run's history that does not match the audit log; or, with run_id an anchor
// workflow's ID (or its chain's prefix), a head pushed to Temporal that does not, an anchor workflow
// that is not agentd's, or records no pushed head covers.
message AnchorMismatch {
  string run_id = 1;
  string activity_id = 2;           // the gateway call's, as the workflow named it
  int64 seq = 3;                    // the record the result names; 0 when it names none
  string why = 4;
}

message RunMismatch {
  string run_id = 1;
  string why = 2;
}

message UnavailableRun {
  string run_id = 1;
  string why = 2;
}

message ExportAuditRequest {
  string run_id = 1;                // this run's records and histories only; empty: the whole chain and every run
}

// One part of an export (agentctl audit export writes them as one JSON document), in order: each
// execution's history; then, for the whole chain, the heads agentd pushed to the chain's anchor
// workflows in Temporal; then the chain's head and every record up to it. A reader recomputes each
// record's sha256 from its fields (internal/audit's Hash), checks each anchor's result_json against
// its call record's result_sha256 and against the history, and each pushed head against the record
// at its seq.
message AuditExportPart {
  oneof part {
    AuditExportHead head = 1;
    AuditRecord record = 2;
    ExecutionHistory history = 3;
    PushedHead pushed_head = 4;
  }
}

// A head of the chain that agentd pushed to one of the chain's anchor workflows in Temporal (design
// doc, section 8), out of reach of whoever can write the ledger: the record at seq had this sha256.
message PushedHead {
  string anchor_workflow_id = 1;
  int64 seq = 2;
  string sha256 = 3;
}

// The chain as the export found it: its head, and how many records it exports.
message AuditExportHead {
  int64 seq = 1;                    // the chain's head at export time: the last record exported is this one, unless cut
  string sha256 = 2;
  int64 records = 3;                // the records the export holds: every one to seq, or the run's
  string exported_at = 4;           // RFC 3339
  string run_id = 5;                // as asked; empty for the whole chain
  // Why the export holds fewer records than the chain's (or the run's) up to seq: it stops before the
  // record that would take it past agentd's bound on an export's size. Empty when it holds them all.
  string cut = 6;
}

// A record of the audit log, with every field its sha256 covers.
message AuditRecord {
  int64 seq = 1;
  string at = 2;
  string workflow_id = 3;
  string type = 4;
  string actor = 5;
  optional int64 peer_uid = 6;      // unset when NULL: hashed as the empty string
  string payload = 7;               // the JSON text as hashed
  string prev_sha256 = 8;
  string sha256 = 9;
}

// One execution of a run, its history as agentd read it from Temporal, and the anchors in it: which
// event carries which record (the _audit of a gateway call's result).
message ExecutionHistory {
  string run_id = 1;
  string temporal_run_id = 2;
  // The history's events in protojson (temporal.api.history.v1.History): agentd's encoding of what
  // Temporal returned, not Temporal's own bytes. A reader with access to Temporal compares the events.
  string history_json = 3;
  repeated ExportedAnchor anchors = 4;
  string unavailable = 5;           // why there is no history: Temporal no longer has it
}

message ExportedAnchor {
  int64 event_id = 1;               // the ActivityTaskCompleted event that carries it
  string activity_id = 2;
  int32 attempt = 3;                // the attempt that completed the call
  int64 seq = 4;                    // the record it names
  string sha256 = 5;
  // The bytes whose sha256 the call's record holds (result_sha256): the result's value_json, as the
  // history holds it, without its _audit, as agentd encodes it (internal/audit's ResultJSON). Empty
  // when the value cannot be read.
  bytes result_json = 6;
}
