[project]
name = "agentos"
version = "0.1.0.dev0"
description = "Agent OS: the Python Worker that runs task workflows, plus the black-box test suite"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.34,<2",
  "protobuf>=7.35.1,<8",
]

[dependency-groups]
dev = [
  "grpcio>=1.84",
  "grpcio-tools>=1.84",
  "pytest>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/agentos", "python/agentos_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli_level = "INFO"
