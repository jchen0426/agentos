# US dollars per million tokens. Versioned: the ledger records which version priced each
# request. Taken from the official pricing pages (design doc, section 9): Anthropic's on
# 2026-10-15 and 2026-10-17, OpenAI's on 2026-10-18.
price_table_version: 2026-10-18
models:
  anthropic/claude-opus-5-5:
    input: 4.00
    cache_write_5m: 5.00
    cache_write_1h: 8.00
    cache_read: 0.20
    output: 20.00
  anthropic/claude-opus-4-8:      # the server-side fallback for refusals (models.yaml); 2026-10-17
    input: 5.00
    cache_write_5m: 6.25
    cache_write_1h: 10.00
    cache_read: 0.50
    output: 25.00
  openai/gpt-6.1-sol:             # caching is automatic; a cache write costs 1.25x input
    input: 2.00
    cache_write: 2.50
    cache_read: 0.10
    output: 10.00
    long_context: {above: 272000, input: 2.0, output: 1.5}   # multiples on the whole request past 272K input tokens
  local/gpt-oss:20b: {input: 0, output: 0}   # self-hosted: compute is not in the budget
