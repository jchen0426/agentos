# Like agentd.yaml, but the model task goes to Claude (../models.yaml), at real prices. It needs
# the agentos-anthropic-api-key item in the login keychain; see the README. No github section: the
# GitHub tools only dry-run. Given one (README), each pull request waits for a person's approval
# (the dev policy): text in a diff can steer a real model, and a person sees the patch first.
runtime_listen: tcp://127.0.0.1:7244
temporal: {address: 127.0.0.1:7233}
policy_file: policy.yaml
models_file: ../models.yaml
prices_file: ../prices.yaml
repos:
  acme/payments: ~/.agentos/mirror      # any local git repository
# agentd reads repositories through the git tool server, run per call in this sandbox (macOS;
# on Linux, ../../sandbox/linux/run-tool.sh). It needs `npm ci` in sandbox/macos.
git_tools: {sandbox: [../../sandbox/macos/run-tool.sh]}
# agentd starts the Worker itself, in this sandbox (macOS; on Linux, ../../sandbox/linux/run-worker.sh,
# with the unix:// Runtime socket), and starts it again whenever it exits. It needs `npm ci` in
# sandbox/macos, and a Python outside the home directory, which the sandbox cannot read: the
# environment's bin/python must lead there. With --no-worker agentd starts none (README).
worker: {sandbox: [../../sandbox/macos/run-worker.sh], python: ../../.venv, code: ../../python}
