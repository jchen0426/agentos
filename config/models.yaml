# models.yaml: which provider and model serve each task name (D11). Paths are relative to this
# file.
providers:
  anthropic: {adapter: anthropic,     key: "keyring:agentos-anthropic-api-key", requests_per_minute: 20}   # account: the user agentd runs as
  # OpenAI's Responses API. GPT-6 models take efforts low to max.
  openai:    {adapter: openai_compat, api: responses, base_url: "https://api.openai.com/v1",
              key: "keyring:agentos-openai-api-key", requests_per_minute: 20, efforts: [low, medium, high, xhigh, max]}
  # Ollama, on Chat Completions; vLLM uses the same adapter. Start Ollama with
  # OLLAMA_CONTEXT_LENGTH=65536, the context_tokens here: it cuts longer input without a word.
  # gpt-oss takes efforts low to high. Listed only to medium, which caps what it is sent: at
  # high, gpt-oss:20b spends all its output tokens reasoning and writes no answer to most audits
  # (the evaluation's pilot, docs/m5-notes.md, section D).
  local:     {adapter: openai_compat, api: chat, base_url: "http://127.0.0.1:11434/v1", context_tokens: 65536,
              efforts: [low, medium]}
tasks:
  audit_v1:
    model: anthropic/claude-opus-5-5
    max_tokens: 16000                      # bounds the budget reservation of every request
    effort: high
    prompt: prompts/audit_v1/claude.md     # prompts may differ per model; the version is recorded per call
    output_schema: schemas/audit_report.json
    blobs: [patch]                         # stored as blobs; the workflow gets patch_ref
    # Server-side fallback for refusals: the reservation covers it, priced in prices.yaml.
    fallback: [anthropic/claude-opus-4-8]
    # Other providers' models, asked in turn when the answer is still a refusal, each in a
    # request of its own (design doc, section 9). Off unless listed; the policy must allow
    # each provider for the task:
    # cross_provider_fallback: [openai/gpt-6.1-sol, local/gpt-oss:20b]
