# The Go checks, and the black-box suite (T1, T8, T10, the replay gate, mTLS, ...) with
# Workers unsandboxed and under bubblewrap on Linux, and under sandbox-runtime (srt) on macOS, on
# every push to main and every pull request. The design doc wants the fault-injection tests on
# every commit, and T10 relies on the replay gate (tests/test_replay.py) stopping incompatible
# workflow changes here. A pull request that changes only documentation skips them (the changes
# job); main runs them again once it is merged. Every night, and when started by hand, main runs
# everything again with --verify-after-each: agentctl audit verify after every test that starts an
# agentd, so an honest flow that leaves the audit log unverifiable fails here.
name: CI

on:
  # Push only on main: a push to a pull request's branch runs once, as pull_request, which tests
  # the branch merged with main. Push on every branch ran each job twice there. A branch without
  # a pull request gets no run.
  push:
    branches: [main]
  pull_request:
  # GitHub runs a schedule on the default branch only. 16:17 UTC is 03:17 in Sydney (UTC+11).
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GO_VERSION: '1.26.x'
  # The black-box jobs' pytest gets this: the nightly run, and a run started by hand, verify the
  # audit log after every test (tests/conftest.py's --verify-after-each).
  VERIFY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--verify-after-each' || '' }}

# Pinned to Ubuntu 24.04 rather than ubuntu-latest: the bubblewrap setup below (AppArmor,
# the system Python under /usr) is what M1 verified on 24.04.
jobs:
  # Whether a pull request changes only documentation: Markdown files under docs/ and the
  # top-level README.md, which no build, test or prompt reads. Not every Markdown file is
  # documentation (config/prompts/audit_v1/claude.md is the model's prompt), and not every file
  # under docs/ is (go test ./... would build a .go file there). The jobs below skip such a pull
  # request, and a job skipped by its if satisfies a required check. A push to main always runs
  # everything. So does a pull request into another branch: retargeted to main later, it gets no
  # new run, and its checks would stand for a comparison with the wrong base.
  changes:
    name: Docs-only check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit the other jobs test, and its two parents.
          fetch-depth: 2
      - id: diff
        name: Compare the merge commit with main
        run: |
          # HEAD is the pull request merged into main; its first parent is main's tip.
          if ! git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            echo "::warning::HEAD is not the pull request's merge commit; running everything"
            exit 0
          fi
          # --no-renames lists both sides of a rename: moving code into docs/ changes code.
          changed=$(git -c core.quotePath=false diff --no-renames --name-only 'HEAD^1' HEAD)
          # The pull request names these files, and the runner finds workflow commands such as
          # ##[set-output ...] anywhere in a line: commands stay off while the names print.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          printf '%s\n' "$changed"
          echo "::$token::"
          docs_only=true
          docs='^(docs/.+\.md|README\.md)$'
          while IFS= read -r path; do
            [[ $path =~ $docs ]] || docs_only=false
          done <<<"$changed"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  go:
    name: Go (gofmt, vet, test)
    needs: changes
    # Runs unless the changes job found only documentation: also when it was skipped (a push, or
    # a pull request into another branch) or failed.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # A build output or a dump committed by a broad `git add` (GitHub refuses files over
      # 100 MB, and this repository is public): no tracked file may be over 5 MB.
      - name: No tracked file over 5 MB
        run: |
          git ls-files -z | xargs -0 -r stat --format=$'%s\t%n' |
            awk -F'\t' '$1 > 5 * 1024 * 1024 { printf "::error::%s is %d bytes, over 5 MB\n", $2, $1; big = 1 } END { exit big }'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n $unformatted ]]; then
            echo "::error::gofmt would reformat these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  # Two jobs rather than a matrix: a matrix job skipped by its if reports one check, named with
  # ${{ matrix.sandbox }} unexpanded, so the required checks (one per sandbox) would never
  # arrive. blackbox-bwrap reuses these steps through the YAML anchor.
  blackbox-none:
    name: Black-box tests (AGENTOS_SANDBOX=none)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    # The suite took about 16 minutes before the audit log's tests; recent runs took 27 to 30, and
    # M5 C2c's tests of the Worker's liveness and pinned code add about 4.
    timeout-minutes: 50
    env:
      AGENTOS_SANDBOX: none
      # The system Python: bubblewrap mounts /usr and the virtualenv into the sandbox, but
      # not the home directory, where uv keeps the Pythons it downloads.
      UV_PYTHON: /usr/bin/python3
    steps: &blackbox-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The sandboxed Worker can read the checkout, so no token in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          # Both black-box jobs use the same cache key; one writer avoids a failed save.
          save-cache: ${{ env.AGENTOS_SANDBOX == 'none' }}

      - name: Install the Temporal CLI
        env:
          VERSION: 1.9.1
          SHA256: 09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5
        run: |
          asset=temporal_cli_${VERSION}_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/temporalio/cli/releases/download/v$VERSION/$asset"
          echo "$SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bin" temporal
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/temporal" --version

      - name: Install the full Temporal server, for tests/test_temporal_mtls.py
        run: ./scripts/fetch-temporal-server.sh

      - name: Install bubblewrap and grant it user namespaces
        if: env.AGENTOS_SANDBOX == 'bwrap'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat
          # Ubuntu 23.10+ sets kernel.apparmor_restrict_unprivileged_userns=1, and an
          # unconfined bwrap gets a user namespace without capabilities. The same profile
          # as vm/lima/agentos.yaml.
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,

            include if exists <local/bwrap>
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          bwrap --version
          # Fails with "loopback: Failed RTM_NEWADDR" if the profile did not take.
          bwrap --unshare-all --ro-bind / / true

      - run: make build
      - run: uv sync --locked --group dev

      - name: pytest
        # The test data stays outside the checkout, which the bwrap sandbox mounts: the
        # sandbox probe checks that the Worker cannot read agentd's ledger.
        run: uv run --no-sync pytest tests/ -ra --durations=0 --basetemp="$RUNNER_TEMP/pytest" $VERIFY

      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackbox-logs-${{ env.AGENTOS_SANDBOX }}
          path: ${{ runner.temp }}/pytest
          retention-days: 7
          if-no-files-found: ignore

  blackbox-bwrap:
    name: Black-box tests (AGENTOS_SANDBOX=bwrap)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50 # as blackbox-none's
    env:
      AGENTOS_SANDBOX: bwrap
      UV_PYTHON: /usr/bin/python3
    steps: *blackbox-steps

  # The black-box suite with Workers under sandbox-runtime (Seatbelt), as on the author's Mac: the
  # macOS sandbox's tests (T9's probes, the launcher's deny list and state directory) run only here.
  blackbox-srt:
    name: Black-box tests (AGENTOS_SANDBOX=srt, macOS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: macos-15
    # The suite takes about 31 minutes on the author's Mac; GitHub's macOS runners are slower: recent
    # runs took 42 to 49, before M5 C2c's tests added about 4.
    timeout-minutes: 75
    env:
      AGENTOS_SANDBOX: srt
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The sandboxed Worker can read the checkout, so no token in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'

      # The sandbox denies reads under the home directory, /Users/runner, where setup-python's tool
      # cache and uv's own Pythons live, and lets the Worker read only its virtualenv and the
      # checkout there. The virtualenv's interpreter is a symlink to its base Python, so that Python
      # must live outside the home directory: Homebrew's, under /opt/homebrew.
      - name: Install Python 3.12 with Homebrew
        run: |
          brew install python@3.12
          echo "UV_PYTHON=$(brew --prefix python@3.12)/bin/python3.12" >> "$GITHUB_ENV"

      # srt needs Node 22.12 or later; the image's Node is Homebrew's node@22.
      - name: Check Node
        run: |
          node --version
          node -e 'const [a, b] = process.versions.node.split(".").map(Number);
            process.exit(a > 22 || (a === 22 && b >= 12) ? 0 : 1)'

      - name: Install the Temporal CLI
        env:
          VERSION: 1.9.1
          SHA256: 41e0425378fcb4fb5766340b97435e20fe47bbff2d7bf644ec2d51f7662b7c56
        run: |
          asset=temporal_cli_${VERSION}_darwin_arm64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/temporalio/cli/releases/download/v$VERSION/$asset"
          echo "$SHA256  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bin" temporal
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/temporal" --version

      - name: Install the full Temporal server, for tests/test_temporal_mtls.py
        run: ./scripts/fetch-temporal-server.sh

      - run: make build
      - run: uv sync --locked --group dev
      # srt and its dependencies have no install scripts (sandbox/macos/package-lock.json).
      - run: npm ci --ignore-scripts
        working-directory: sandbox/macos

      - name: pytest
        # The test data stays outside the checkout, under the runner's temporary directory, which
        # the sandbox denies too: the probes check that the Worker cannot read agentd's ledger.
        run: uv run --no-sync pytest tests/ -ra --durations=0 --basetemp="$RUNNER_TEMP/pytest" $VERIFY

      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackbox-logs-srt
          path: ${{ runner.temp }}/pytest
          retention-days: 7
          if-no-files-found: ignore
